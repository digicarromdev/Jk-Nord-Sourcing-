<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JK NordSourcing</title>
    <script type="text/javascript">
      // SPA Fallback for Static Web Hosts
      // Redirects 404 paths back to root index.html with the target route in query string
      (function() {
        var path = window.location.pathname;
        var search = window.location.search ? '&' + window.location.search.slice(1) : '';
        var hash = window.location.hash;
        window.location.replace('/?p=' + encodeURIComponent(path) + search + hash);
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; background: #0a1628; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="color: #c9a84c;">Redirecting to JK NordSourcing...</h2>
      <p style="color: #94a3b8;">If you are not redirected automatically, <a href="/" style="color: #c9a84c;">click here</a>.</p>
    </div>
  </body>
</html>
